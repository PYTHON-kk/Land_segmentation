model:
  name: SwinUNetPlusPlus
  backbone: swin_base_patch4_window7_224
  num_classes: 6
  pretrained: true
  deep_supervision: true

training:
  epochs: 150
  batch_size: 4          # RTX 3050 4GB VRAM — use 4, reduce to 2 if OOM
  optimizer: adamw
  encoder_lr: 0.00001    # lower LR for pretrained encoder
  decoder_lr: 0.0001     # higher LR for fresh decoder
  weight_decay: 0.01
  warmup_epochs: 10
  grad_clip: 1.0
  loss: focal_dice_ce

data:
  raw_dir: "../Semantic segmentation dataset"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  img_size: 224
  tile_size: 224
  resize_to: 672
  train_augmentation: true

target_metrics:
  min_miou: 0.82
  min_accuracy: 0.95

class_names:
  - building
  - land
  - road
  - vegetation
  - water
  - unlabeled
